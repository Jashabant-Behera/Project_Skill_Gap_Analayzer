version: '3.8'

services:
  # FastAPI Application
  api:
    build: .
    container_name: skill_assessment_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=skill_assessment_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb
      - redis
    networks:
      - skill_assessment_network
    restart: unless-stopped
    volumes:
      - ./app:/app/app  # For development hot-reload

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: skill_assessment_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=skill_assessment_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - skill_assessment_network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: skill_assessment_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - skill_assessment_network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  redis_data:

networks:
  skill_assessment_network:
    driver: bridge
